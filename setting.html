<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="school badge.png" sizes="192x192">
<title>Jada High School Settings</title>

<link rel="stylesheet" href="settings.css">
<style>

@import url(
'https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap'
);


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;

}


body{

background:linear-gradient(
135deg,
#0d6efd,
#001f54
);

padding:40px;

}



.container{

max-width:850px;

margin:auto;

background:white;

padding:35px;

border-radius:25px;

box-shadow:0 20px 40px #0004;

}



header{

text-align:center;

}



.logo{

width:90px;

}



header h1{

color:#0d6efd;

}



.settings-card{

margin-top:30px;

padding:30px;

background:#f8f9fa;

border-radius:20px;

}



h2{

color:#0d6efd;

margin-bottom:20px;

}



label{

display:block;

font-weight:600;

margin-top:15px;

}



input[type="text"],
input[type="email"]{

width:100%;

padding:14px;

margin-top:8px;

border:1px solid #ddd;

border-radius:10px;

}



.option{

margin-top:20px;

}



input[type="checkbox"]{

width:18px;

height:18px;

}



button{

width:100%;

padding:15px;

margin-top:25px;

border:none;

border-radius:30px;

background:#0d6efd;

color:white;

font-size:16px;

cursor:pointer;

}



button:hover{

background:#004aad;

}



footer{

text-align:center;

margin-top:30px;

color:#777;

}

</style>

</head>


<body>


<div class="container">


<header>

<img src="school badge.png" class="logo">

<h1>Jada High School</h1>

<p>System Settings</p>

</header>



<div class="settings-card">


<h2>School Information</h2>


<label>School Name</label>

<input 
type="text"
id="schoolName"
value="Jada High School">



<label>School Address</label>

<input 
type="text"
id="address"
placeholder="Enter school address">



<label>Phone Number</label>

<input 
type="text"
id="phone"
placeholder="+234 XXX XXX XXXX">



<label>Email</label>

<input 
type="email"
id="email"
placeholder="school@gmail.com">


<button onclick="saveSettings()">
Save Changes
</button>


</div>





<div class="settings-card">


<h2>System Preferences</h2>


<div class="option">

<label>
<input type="checkbox" id="notification">
Enable Notifications
</label>

</div>



<div class="option">

<label>
<input type="checkbox" id="darkMode">
Dark Mode
</label>

</div>


<button onclick="applySettings()">
Apply Settings
</button>


</div>




<footer>

Powered by <strong>Jada Creative Studio</strong>

</footer>



</div>



<script>

function saveSettings(){


let name =
document.getElementById("schoolName").value;


alert(
"Settings saved successfully for " + name
);


}



function applySettings(){


let dark =
document.getElementById("darkMode").checked;



if(dark){

document.body.style.background="#111";

document.body.style.color="white";

alert("Dark mode enabled");


}

else{

document.body.style.background="#0d6efd";

alert("Light mode enabled");


}



}

</script>


</body>

</html>
