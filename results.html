<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Results Management</title>

<link rel="stylesheet" href="css/results.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f4f7fc;
    padding:30px;
}

.container{
    max-width:1300px;
    margin:auto;
}

h1{
    text-align:center;
    color:#2563eb;
    margin-bottom:30px;
}

.form{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-bottom:25px;
}

.form input,
.form select{
    padding:14px;
    border:2px solid #ddd;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

.form input:focus,
.form select:focus{
    border-color:#2563eb;
}

#saveBtn{
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;
}

#saveBtn:hover{
    background:#1e40af;
}

#search{
    width:100%;
    padding:14px;
    margin-bottom:20px;
    border:2px solid #ddd;
    border-radius:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    border-radius:10px;
    overflow:hidden;
}

th{
    background:#2563eb;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    border-bottom:1px solid #eee;
    text-align:center;
}

tr:hover{
    background:#f8f9ff;
}

.edit{
    background:#f59e0b;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    margin-right:5px;
}

.delete{
    background:#ef4444;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
}

.pass{
    color:green;
    font-weight:bold;
}

.fail{
    color:red;
    font-weight:bold;
}

@media(max-width:768px){

    body{
        padding:15px;
    }

    table{
        display:block;
        overflow-x:auto;
    }

}

</style>
</head>
<body>

<div class="container">

<h1>📚 Results Management</h1>

<div class="form">

<input type="text"
id="studentName"
placeholder="Student Name">

<select id="studentClass">

<option>JSS1</option>
<option>JSS2</option>
<option>JSS3</option>
<option>SS1</option>
<option>SS2</option>
<option>SS3</option>

</select>

<input type="number"
id="math"
placeholder="Mathematics">

<input type="number"
id="english"
placeholder="English">

<input type="number"
id="science"
placeholder="Science">

<input type="number"
id="social"
placeholder="Social Studies">

<input type="number"
id="computer"
placeholder="Computer">

<button id="saveBtn">

Save Result

</button>

</div>

<input
type="text"
id="search"
placeholder="Search Student">

<table>

<thead>

<tr>

<th>Name</th>
<th>Class</th>
<th>Total</th>
<th>Average</th>
<th>Grade</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

<script>

const saveBtn = document.getElementById("saveBtn");
const tableBody = document.getElementById("tableBody");
const search = document.getElementById("search");

let results = JSON.parse(localStorage.getItem("results")) || [];

let editIndex = -1;

renderTable();

// Save Result

saveBtn.onclick = () => {

    const name = document.getElementById("studentName").value.trim();
    const studentClass = document.getElementById("studentClass").value;

    const maths = Number(document.getElementById("math").value);
    const english = Number(document.getElementById("english").value);
    const science = Number(document.getElementById("science").value);
    const social = Number(document.getElementById("social").value);
    const computer = Number(document.getElementById("computer").value);

    if(name === ""){

        alert("Enter Student Name");

        return;

    }

    const total =
        maths +
        english +
        science +
        social +
        computer;

    const average = total / 5;

    let grade = "";
    let status = "";

    if(average >= 70){

        grade="A";
        status="Pass";

    }else if(average >=60){

        grade="B";
        status="Pass";

    }else if(average >=50){

        grade="C";
        status="Pass";

    }else if(average >=45){

        grade="D";
        status="Pass";

    }else if(average >=40){

        grade="E";
        status="Pass";

    }else{

        grade="F";
        status="Fail";

    }

    const student = {

        name,
        studentClass,
        total,
        average:average.toFixed(1),
        grade,
        status

    };

    if(editIndex === -1){

        results.push(student);

    }else{

        results[editIndex]=student;

        editIndex=-1;

    }

    localStorage.setItem("results",JSON.stringify(results));

    clearForm();

    renderTable();

};

// Render Table

function renderTable(data=results){

    tableBody.innerHTML="";

    data.forEach((student,index)=>{

        tableBody.innerHTML += `

        <tr>

        <td>${student.name}</td>

        <td>${student.studentClass}</td>

        <td>${student.total}</td>

        <td>${student.average}</td>

        <td>${student.grade}</td>

        <td class="${student.status==="Pass"?"pass":"fail"}">
        ${student.status}
        </td>

        <td>

        <button
        class="edit"
        onclick="editResult(${index})">

        Edit

        </button>

        <button
        class="delete"
        onclick="deleteResult(${index})">

        Delete

        </button>

        </td>

        </tr>

        `;

    });

}

// Delete

function deleteResult(index){

    if(confirm("Delete Result?")){

        results.splice(index,1);

        localStorage.setItem("results",JSON.stringify(results));

        renderTable();

    }

}

// Edit

function editResult(index){

    const student = results[index];

    document.getElementById("studentName").value = student.name;

    document.getElementById("studentClass").value = student.studentClass;

    alert("For now, re-enter the subject scores and click Save.");

    editIndex = index;

}

// Search

search.addEventListener("keyup",()=>{

    const keyword = search.value.toLowerCase();

    const filtered = results.filter(student=>

        student.name.toLowerCase().includes(keyword) ||

        student.studentClass.toLowerCase().includes(keyword)

    );

    renderTable(filtered);

});

// Clear

function clearForm(){

    document.getElementById("studentName").value="";

    document.getElementById("math").value="";

    document.getElementById("english").value="";

    document.getElementById("science").value="";

    document.getElementById("social").value="";

    document.getElementById("computer").value="";

}

</script>

</body>
</html>
