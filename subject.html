<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="school badge.png" sizes="192x192">
<title>Jada High School Subjects</title>

<link rel="stylesheet" href="subjects.css">
<style>

@import url(
'https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap'
);


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;

}



body{

background:linear-gradient(
135deg,
#0d6efd,
#001f54
);

padding:40px;

}



.container{

max-width:900px;

margin:auto;

background:white;

padding:35px;

border-radius:20px;

box-shadow:0 20px 40px #0004;

}



header{

text-align:center;

}


.logo{

width:90px;

}



header h1{

color:#0d6efd;

}



.form{

margin-top:30px;

}



input,
select{

width:100%;

padding:14px;

margin:10px 0;

border-radius:10px;

border:1px solid #ddd;

}



button{

width:100%;

padding:15px;

background:#0d6efd;

color:white;

border:none;

border-radius:30px;

font-size:16px;

cursor:pointer;

}



button:hover{

background:#004aad;

}



h2{

text-align:center;

color:#0d6efd;

margin:30px;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#0d6efd;

color:white;

padding:12px;

}



td{

padding:12px;

border:1px solid #ddd;

text-align:center;

}



footer{

text-align:center;

margin-top:30px;

color:#777;

}

</style>

</head>


<body>


<div class="container">


<header>

<img src="school badge.png" class="logo">

<h1>Jada High School</h1>

<p>Subject Management System</p>

</header>



<section class="form">


<h2>Add Subject</h2>


<input 
type="text"
id="subjectName"
placeholder="Enter Subject Name">



<select id="department">

<option>Science</option>
<option>Arts</option>
<option>Commercial</option>

</select>



<select id="class">

<option>SS1</option>
<option>SS2</option>
<option>SS3</option>

</select>



<input
type="text"
id="teacher"
placeholder="Teacher Name">



<button onclick="addSubject()">
Add Subject
</button>


</section>




<h2>Available Subjects</h2>


<table>


<thead>

<tr>

<th>Subject</th>

<th>Department</th>

<th>Class</th>

<th>Teacher</th>

</tr>

</thead>


<tbody id="subjectList">


</tbody>


</table>




<footer>

Powered by <strong>Jada Creative Studio</strong>

</footer>



</div>



<script>

function addSubject(){


let subject =
document.getElementById("subjectName").value;


let department =
document.getElementById("department").value;


let studentClass =
document.getElementById("class").value;


let teacher =
document.getElementById("teacher").value;



let row = `

<tr>

<td>${subject}</td>

<td>${department}</td>

<td>${studentClass}</td>

<td>${teacher}</td>

</tr>

`;



document.getElementById("subjectList")
.innerHTML += row;



document.getElementById("subjectName").value="";
document.getElementById("teacher").value="";


}

</script>

</body>

</html>
